server:
  port: ${PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 20s
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://registry:RegistryDemo123@localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  user-public-key: ${USER_PUBLIC_KEY:classpath:keys/demo-user-public.pem}
logging:
  structured:
    format:
      console: logstash
