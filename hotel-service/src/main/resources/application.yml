server:
  port: ${PORT:8082}
spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hotel-service;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://registry:RegistryDemo123@localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: logstash
app:
  seed: ${SEED_DATA:true}
  user-public-key: ${USER_PUBLIC_KEY:classpath:keys/demo-user-public.pem}
  internal-public-key: ${INTERNAL_PUBLIC_KEY:classpath:keys/demo-internal-public.pem}
