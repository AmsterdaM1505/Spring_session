name: Build and integration checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and service integration tests
        run: mvn -B verify
      - name: Launch all four applications
        run: docker compose up -d --build --wait
      - name: End to end checks
        run: python3 scripts/e2e.py --faults --output evidence/runtime/e2e.json
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p evidence/runtime
          docker compose logs --no-color > evidence/runtime/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            **/target/surefire-reports/
            evidence/runtime/
      - name: Stop containers
        if: always()
        run: docker compose down -v
